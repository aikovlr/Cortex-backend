$kind: http-example
request:
  url: "{{baseUrl}}/api/Usuario/me"
  method: PUT
  headers:
    Content-Type: multipart/form-data
  body:
    type: formdata
    content:
      - type: text
        key: Nome
        value: string
      - type: text
        key: Email
        value: string
      - type: text
        key: Senha
        value: string
      - type: text
        key: Telefone
        value: string
      - type: file
        key: FotoPerfil
        src: []
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
